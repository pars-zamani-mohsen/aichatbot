[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:fastapi]
command=bash -c "python /app/docker_init.py && python /app/run.py"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
user=root
environment=PATH="/usr/local/bin:%(ENV_PATH)s"

# Nginx is handled by separate container
# [program:nginx]
# command=nginx -g "daemon off;"
# autostart=true
# autorestart=true
# stderr_logfile=/var/log/supervisor/nginx.err.log
# stdout_logfile=/var/log/supervisor/nginx.out.log
# user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
