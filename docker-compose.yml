version: '3.8'

# Enable BuildKit for faster builds
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ai_password}
      - POSTGRES_DB=${POSTGRES_DB:-ai_chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "${DATABASE_PORT:-5445}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_chatbot}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: ai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6397}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-false}
      - SERVER_IP=${SERVER_IP}
      - BACKEND_PORT=${BACKEND_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ai_data:/app/data
      - ai_logs:/app/logs
      - ai_uploads:/app/uploads
      - ai_knowledge:/app/knowledge_base
      - ai_chroma:/app/chroma_db
    ports:
      - "${BACKEND_PORT:-5000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        - REACT_APP_API_URL=http://${SERVER_IP}:${NGINX_HTTP_PORT:-8380}
        - REACT_APP_FRONTEND_URL=http://${SERVER_IP}:${FRONTEND_PORT:-3001}
    container_name: ai_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REACT_APP_API_URL=http://${SERVER_IP}:${NGINX_HTTP_PORT:-8380}
      - REACT_APP_FRONTEND_URL=http://${SERVER_IP}:${FRONTEND_PORT:-3001}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8380}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for local LLM (optional) - DISABLED
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ai_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11435:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   healthcheck:
  #     test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # ChromaDB for vector storage
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: ai_chromadb
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8802}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    # healthcheck:
    #   test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # ollama_data:
  #   driver: local
  chromadb_data:
    driver: local
  ai_data:
    driver: local
  ai_logs:
    driver: local
  ai_uploads:
    driver: local
  ai_knowledge:
    driver: local
  ai_chroma:
    driver: local

networks:
  default:
    name: ai_network
